<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TraceGuard Scanner</title>
  <style>
    body {
      width: 250px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
    }
    .header {
      background-color: #1e293b;
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #06b6d4;
    }
    .content {
      padding: 16px;
    }
    .status-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
    }
    .status-card.active {
      border-color: #10b981;
    }
    .status-card h2 {
      margin: 0 0 4px 0;
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-card .status-text {
      font-size: 14px;
      font-weight: bold;
      color: #34d399;
    }
    .footer {
      margin-top: 16px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
    <h1>TraceGuard</h1>
  </div>
  <div class="content">
    <div class="status-card active">
      <h2>Real-Time Scanner</h2>
      <div class="status-text">Active & Monitoring</div>
    </div>
    <div class="footer">
      Powered by TraceGuard Core
    </div>
  </div>
</body>
</html>
